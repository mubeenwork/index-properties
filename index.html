<!doctype html>
<html lang="en" data-theme="light" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index Realty Brokerage | GTA Real Estate</title>
    <meta name="description" content="Buy, sell or rent across Brampton, Mississauga, Toronto and the Greater Toronto Area with Index Realty Brokerage." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
    <!-- Set the theme before React loads so the page never flashes the wrong colours -->
    <script>
      (function () {
        var r = document.documentElement
        var t = null
        try { t = localStorage.getItem('idx-theme') } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        r.setAttribute('data-theme', t)
        r.setAttribute('data-bs-theme', t)
        if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) r.classList.add('anim')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
